[package]
name = "audio-graph"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
rust-version = "1.85"
description = "Real-time-safe directed node-graph audio processing engine for Rust (topological scheduling, alloc-free process_cycle, rtrb bridge)"
repository = "https://github.com/IT-Whistle/audio-graph"
keywords = ["audio", "dsp", "real-time", "graph", "node"]
categories = ["multimedia::audio"]
publish = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-freebsd", "x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
audio-core = { version = "0.1.0", path = "../audio-core" }
rtrb = "0.3"
thiserror = "2.0"

[dev-dependencies]
# Tests/examples/doctests name audio_core directly; it is also a regular dep.
audio-core = { path = "../audio-core" }
proptest = "1.11.0"
